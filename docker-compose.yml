services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: novaigra
      POSTGRES_PASSWORD: novaigra
      POSTGRES_DB: novaigra
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U novaigra -d novaigra"]
      interval: 5s
      timeout: 5s
      retries: 10

  bot:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg2://novaigra:novaigra@db:5432/novaigra
    ports:
      - "8080:8080"
    volumes:
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
